name: PHP Tests

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "composer.json"
      - ".php-cs-fixer.dist.php"
      - "rector.php"
      - "psalm.xml"
      - "phpunit.xml"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Check PSR-4 autoload
        run: composer dump-autoload --optimize --strict-psr

      - name: Check code style (dry-run)
        run: composer run lint

      - name: Check refactorings (dry-run)
        run: composer run check

      - name: Run PHPStan
        run: composer run phpstan

      - name: Run Psalm
        run: composer run psalm

      - name: Fetch base branch for BC check
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Check public API backward compatibility
        run: composer run bc

      - name: Ensure automated tools left the tree unchanged
        run: git diff --exit-code

  test:
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        php: [8.2, 8.3, 8.4, 8.5]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.php == '8.5' && 'xdebug' || 'none' }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run tests
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ] && [ "${{ matrix.php }}" = "8.5" ]; then
            vendor/bin/pest --colors=always --coverage-clover build/logs/clover.xml
          else
            vendor/bin/pest --colors=always
          fi

      - name: Upload coverage results to Coveralls
        if: matrix.os == 'ubuntu-latest' && matrix.php == '8.5'
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          composer global require php-coveralls/php-coveralls
          php-coveralls --coverage_clover=build/logs/clover.xml -v
